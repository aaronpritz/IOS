<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Chen Kong</title>
<style>
  :root { --scale: 1; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #0a0a12;
    color: #fff;
    font-family: "Courier New", monospace;
    overflow: hidden;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #wrap {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  #game {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #000;
    border: 3px solid #2a2a44;
    box-shadow: 0 0 40px rgba(0, 180, 255, 0.25);
    max-width: 100%;
    max-height: 80vh;
    touch-action: none;
  }
  #hint {
    font-size: 13px;
    color: #6a6a8a;
    letter-spacing: 1px;
    text-align: center;
  }
  /* On-screen controls for touch devices */
  #touch {
    display: none;
    width: 100%;
    max-width: 520px;
    justify-content: space-between;
    padding: 0 14px;
  }
  .pad { display: flex; gap: 12px; }
  .btn {
    width: 64px; height: 64px;
    border-radius: 14px;
    background: rgba(40, 50, 80, 0.85);
    border: 2px solid #3a4a7a;
    color: #cfe8ff;
    font-size: 26px;
    display: flex; align-items: center; justify-content: center;
    touch-action: none;
  }
  .btn:active, .btn.on { background: #2f7fff; color: #fff; }
  #jump { width: 80px; background: rgba(80,40,60,.85); border-color:#7a3a5a; }
  @media (pointer: coarse) { #touch { display: flex; } }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="448" height="496"></canvas>
  <div id="hint">← →  move &nbsp;•&nbsp; ↑  climb &nbsp;•&nbsp; SPACE  jump &nbsp;•&nbsp; ENTER  start</div>
  <div id="touch">
    <div class="pad">
      <div class="btn" data-k="left">◀</div>
      <div class="btn" data-k="up">▲</div>
      <div class="btn" data-k="down">▼</div>
      <div class="btn" data-k="right">▶</div>
    </div>
    <div class="pad">
      <div class="btn" id="jump" data-k="jump">JUMP</div>
    </div>
  </div>
</div>
<script>
(() => {
"use strict";

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const W = canvas.width, H = canvas.height;
ctx.imageSmoothingEnabled = false;

// ---------- Input ----------
const keys = {};
const KEYMAP = {
  ArrowLeft: "left", ArrowRight: "right", ArrowUp: "up", ArrowDown: "down",
  KeyA: "left", KeyD: "right", KeyW: "up", KeyS: "down",
  Space: "jump", Enter: "start", KeyJ: "jump",
};
addEventListener("keydown", e => {
  const k = KEYMAP[e.code];
  if (k) { keys[k] = true; e.preventDefault(); }
});
addEventListener("keyup", e => {
  const k = KEYMAP[e.code];
  if (k) { keys[k] = false; e.preventDefault(); }
});
// Touch buttons
document.querySelectorAll("#touch .btn").forEach(b => {
  const k = b.dataset.k === "start" ? "start" : b.dataset.k;
  const on = e => { e.preventDefault(); keys[b.dataset.k] = true; if (b.dataset.k === "jump") keys.start = true; b.classList.add("on"); };
  const off = e => { e.preventDefault(); keys[b.dataset.k] = false; if (b.dataset.k === "jump") keys.start = false; b.classList.remove("on"); };
  b.addEventListener("touchstart", on, {passive:false});
  b.addEventListener("touchend", off, {passive:false});
  b.addEventListener("touchcancel", off, {passive:false});
  b.addEventListener("mousedown", on);
  b.addEventListener("mouseup", off);
  b.addEventListener("mouseleave", off);
});
// Tap canvas to start
canvas.addEventListener("touchstart", e => { e.preventDefault(); keys.start = true; setTimeout(()=>keys.start=false, 100); }, {passive:false});

// ---------- Tiny sound engine (WebAudio, no files) ----------
let actx = null;
function audio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} }
  return actx;
}
function beep(freq, dur, type="square", vol=0.08) {
  const a = audio(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.value = vol;
  o.connect(g); g.connect(a.destination);
  const t = a.currentTime;
  o.start(t);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.stop(t + dur);
}
const SFX = {
  jump: () => beep(520, 0.15, "square", 0.07),
  climb: () => beep(300, 0.05, "triangle", 0.04),
  hit: () => { beep(160, 0.3, "sawtooth", 0.12); beep(80, 0.4, "sawtooth", 0.1); },
  point: () => { beep(880, 0.07, "square", 0.06); setTimeout(()=>beep(1320,0.07,"square",0.05), 60); },
  win: () => { [523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,0.18,"square",0.08), i*120)); },
  throw: () => beep(220, 0.12, "sawtooth", 0.05),
  land: () => beep(110, 0.09, "triangle", 0.07),
  smash: () => { beep(200, 0.08, "square", 0.05); beep(90, 0.12, "sawtooth", 0.05); },
  start: () => { [392,523,659].forEach((f,i)=>setTimeout(()=>beep(f,0.12,"square",0.07), i*100)); },
};

// ---------- Game constants ----------
const GRAV = 0.5;
const RUN = 1.8;
const JUMP_V = -8.2;
const TILE = 16;

// Level geometry: platforms are horizontal beams (Donkey-Kong style, slightly sloped feel via steps)
// Each platform: {x, y, w} ; ladders: {x, y, h}
// Built bottom-up. y is top surface.
function buildLevel() {
  const platforms = [];
  const ladders = [];
  // 6 girders
  const floors = [];
  const baseY = H - 24;
  const gap = 76;
  for (let i = 0; i < 6; i++) {
    const y = baseY - i * gap;
    // alternate slight offset so it feels like classic slanted girders
    floors.push(y);
    platforms.push({ x: 0, y, w: W, top: true });
  }
  // Ladders connecting floors (zig-zag)
  // floor index 0 = bottom
  const ladderCols = [
    [0, 360], [1, 90], [2, 360], [3, 90], [4, 300],
  ];
  for (const [fi, x] of ladderCols) {
    const yTop = floors[fi + 1];
    const yBot = floors[fi];
    ladders.push({ x, y: yTop, h: yBot - yTop, bottom: yBot, top: yTop });
  }
  // a couple of extra ladders for routes
  ladders.push({ x: 200, y: floors[1], h: floors[0]-floors[1], bottom: floors[0], top: floors[1] });
  ladders.push({ x: 230, y: floors[3], h: floors[2]-floors[3], bottom: floors[2], top: floors[3] });

  return { platforms, ladders, floors, baseY };
}
let level = buildLevel();

// ---------- Entities ----------
const player = {
  x: 40, y: 0, w: 16, h: 20,
  vx: 0, vy: 0,
  onGround: false, onLadder: false, climbing: false,
  facing: 1, walkFrame: 0, alive: true, jumping: false, squash: 0,
};
function resetPlayer() {
  player.x = 30; player.y = level.baseY - player.h;
  player.vx = 0; player.vy = 0;
  player.onGround = true; player.onLadder = false; player.climbing = false;
  player.alive = true; player.jumping = false; player.facing = 1; player.squash = 0;
}

// Chen Kong sits top-left, princess top-right
const kong = { x: 60, y: level.floors[5] - 44, w: 48, h: 44, throwTimer: 90, anim: 0 };
const goal = { x: W - 70, y: level.floors[5] - 30, w: 22, h: 30 }; // captive

let barrels = [];
let trail = [];      // Spark's running spark-trail particles
let throwFx = [];    // brief flash when Chen Kong releases a doc
let bits = [];       // debris particles (paper shreds, landing puffs)
let popups = [];     // floating score popups
let shake = 0;       // screen-shake magnitude
let flash = 0;       // full-screen flash intensity (0..1)
let flashCol = "255,91,118";
function addShake(n) { shake = Math.min(14, shake + n); }
function addPopup(x, y, text, c) { popups.push({ x, y, text, c: c || "#ffe24a", life: 1 }); }
function spawnBits(x, y, n, col) {
  for (let i = 0; i < n; i++) bits.push({
    x, y, vx: (Math.random() - 0.5) * 3.4, vy: -Math.random() * 2.4 - 0.4,
    life: 1, c: col || (Math.random() < 0.5 ? "#f6f3e7" : "#cfc8a8"),
  });
}
function spawnBarrel() {
  barrels.push({
    x: kong.x + kong.w, y: kong.y + kong.h - 14,
    vx: 1.4, vy: -1.8, w: 13, h: 16,   // tossed up, then arcs down onto the girder
    onLadder: false, floor: 5, rot: 0,
  });
  throwFx.push({ x: kong.x + kong.w + 6, y: kong.y + kong.h - 16, life: 1 });
  SFX.throw();
}

// Per-level colour palette for girders + ladders
function levelPalette(n) {
  const sets = [
    { g: ["#b81f33", "#ff7d92", "#e02a42", "#6e0d1c"], rail: "#56c8ff", railSh: "#155f88", rung: "#b6ecff" },
    { g: ["#1f7d5a", "#7df0c0", "#2ab07e", "#0d4a33"], rail: "#ffd24a", railSh: "#9a7a12", rung: "#fff0b0" },
    { g: ["#5a2f9e", "#b78fff", "#7a45c8", "#33184f"], rail: "#ff9a56", railSh: "#9a4f18", rung: "#ffd0a6" },
    { g: ["#9e5a1f", "#ffc07d", "#c8842a", "#4f2d0d"], rail: "#7dff9a", railSh: "#188a3a", rung: "#b6ffc6" },
  ];
  return sets[(n - 1) % sets.length];
}
let palette = levelPalette(1);

// ---------- State machine ----------
let state = "title"; // title, play, dead, win, gameover
let score = 0, lives = 3, level_num = 1, bestScore = 0;
let stateTimer = 0;
let bonus = 5000;

function startGame() {
  score = 0; lives = 3; level_num = 1;
  newLevel();
  state = "play";
  SFX.start();
}
function newLevel() {
  level = buildLevel();
  resetPlayer();
  barrels = [];
  trail = [];
  throwFx = [];
  bits = [];
  popups = [];
  shake = 0;
  flash = 0;
  palette = levelPalette(level_num);
  kong.throwTimer = 100;
  bonus = 5000;
}
function loseLife() {
  lives--;
  SFX.hit();
  addShake(13);
  flash = 1; flashCol = "255,60,90";
  spawnBits(player.x + player.w/2, player.y + player.h/2, 14, "#7fe0ff");
  if (lives <= 0) { state = "gameover"; stateTimer = 0; bestScore = Math.max(bestScore, score); }
  else { state = "dead"; stateTimer = 0; }
}

// ---------- Helpers ----------
function rectsOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}
function nearLadder(px, py, pw, ph) {
  for (const l of level.ladders) {
    if (px + pw/2 > l.x - 2 && px + pw/2 < l.x + 14 + 2 &&
        py + ph > l.top && py < l.bottom) {
      return l;
    }
  }
  return null;
}
function floorBelow(px, pw, py) {
  // find nearest platform top at or below feet
  let best = null;
  const cx = px + pw/2;
  for (const p of level.platforms) {
    if (cx >= p.x && cx <= p.x + p.w) {
      if (p.y >= py - 4) {
        if (!best || p.y < best.y) best = p;
      }
    }
  }
  return best;
}
function ladderTopAt(cx, feetY) {
  // find a ladder whose top rung meets the girder under these feet
  for (const l of level.ladders) {
    if (cx > l.x - 3 && cx < l.x + 17 && Math.abs(feetY - l.top) < 8) return l;
  }
  return null;
}

// ---------- Update ----------
function updatePlay() {
  bonus = Math.max(0, bonus - 1);
  // ----- Player movement -----
  const p = player;
  const lad = nearLadder(p.x, p.y, p.w, p.h);

  // Climbing logic
  if (lad && (keys.up || keys.down)) {
    if (!p.climbing && keys.up && p.y + p.h > lad.top + 6) { p.climbing = true; }
    if (!p.climbing && keys.down && p.onGround && lad.bottom <= p.y + p.h + 6) { p.climbing = true; }
    else if (!p.climbing && keys.down && p.y + p.h < lad.bottom - 2) { p.climbing = true; }
  }
  if (p.climbing) {
    p.vx = 0; p.vy = 0;
    p.x = lad.x + 7 - p.w/2;
    if (keys.up) { p.y -= 1.4; if ((performance.now()|0) % 8 === 0) SFX.climb(); }
    if (keys.down) { p.y += 1.4; }
    // snap to top
    if (p.y + p.h <= lad.top + 2) { p.climbing = false; p.y = lad.top - p.h; p.onGround = true; }
    // reached bottom
    if (p.y + p.h >= lad.bottom) { p.y = lad.bottom - p.h; p.climbing = false; p.onGround = true; }
    // leave ladder sideways
    if (keys.left || keys.right) {
      // only release if at a floor
      const f = level.floors.find(fy => Math.abs((p.y + p.h) - fy) < 6);
      if (f !== undefined) { p.climbing = false; }
    }
  }

  if (!p.climbing) {
    // horizontal
    if (keys.left) { p.vx = -RUN; p.facing = -1; }
    else if (keys.right) { p.vx = RUN; p.facing = 1; }
    else p.vx = 0;
    if (p.vx !== 0 && p.onGround) p.walkFrame += 0.2;

    // spark-trail while running
    if (p.vx !== 0 && p.onGround) {
      trail.push({
        x: p.x + p.w/2 - p.facing * 5, y: p.y + p.h - 3,
        vx: -p.facing * 0.3, vy: -0.2 - Math.random() * 0.3,
        life: 1, c: Math.random() < 0.3 ? "#ffe24a" : "#7fe0ff",
      });
    }

    // jump (with a little burst of sparks)
    if (keys.jump && p.onGround) {
      p.vy = JUMP_V; p.onGround = false; p.jumping = true; SFX.jump();
      for (let i = 0; i < 6; i++) trail.push({
        x: p.x + p.w/2, y: p.y + p.h - 2,
        vx: (Math.random() - 0.5) * 1.6, vy: Math.random() * 0.6,
        life: 1, c: Math.random() < 0.4 ? "#ffe24a" : "#7fe0ff",
      });
    }

    // gravity
    p.vy += GRAV;
    if (p.vy > 10) p.vy = 10;

    p.x += p.vx;
    p.y += p.vy;

    // walls
    if (p.x < 0) p.x = 0;
    if (p.x + p.w > W) p.x = W - p.w;

    // floor collision (only when falling)
    p.onGround = false;
    if (p.vy >= 0) {
      const f = floorBelow(p.x, p.w, p.y + p.h - p.vy);
      if (f && p.y + p.h >= f.y && p.y + p.h <= f.y + 16 + p.vy) {
        const impact = p.vy;
        p.y = f.y - p.h; p.vy = 0; p.onGround = true; p.jumping = false;
        if (impact > 4) {            // landed from a real fall: squash + dust + thud
          p.squash = 1;
          addShake(Math.min(5, impact * 0.5));
          SFX.land();
          for (let i = 0; i < 5; i++) bits.push({
            x: p.x + p.w/2 + (Math.random() - 0.5) * 10, y: f.y,
            vx: (Math.random() - 0.5) * 2, vy: -Math.random() * 0.8,
            life: 1, c: "#3a4a70",
          });
        }
      }
    }
  }

  // squash recovery
  if (player.squash > 0.02) player.squash *= 0.8; else player.squash = 0;

  // ----- Particles (spark-trail + throw flashes) -----
  for (const t of trail) { t.x += t.vx; t.y += t.vy; t.vy += 0.02; t.life -= 0.07; }
  trail = trail.filter(t => t.life > 0);
  for (const fx of throwFx) fx.life -= 0.08;
  throwFx = throwFx.filter(fx => fx.life > 0);

  // ----- Kong throws barrels -----
  kong.anim += 0.08;
  kong.throwTimer--;
  if (kong.throwTimer <= 0) {
    spawnBarrel();
    kong.throwTimer = 110 + Math.random() * 70 - Math.min(60, level_num * 8);
  }

  // ----- Barrels -----
  for (const b of barrels) {
    // Tumbling down a ladder: glide straight down until the next girder.
    if (b.descending) {
      b.y += 2.2;
      b.x = b.ladderX;
      b.rot += 0.2;
      if (b.y + b.h >= b.targetY) {
        b.y = b.targetY - b.h;
        b.vy = 0;
        b.descending = false;
      }
      b.dead = b.y > H + 40;
      continue;
    }

    b.vy += GRAV;
    if (b.vy > 8) b.vy = 8;
    b.x += b.vx;
    b.y += b.vy;
    b.rot += b.vx * 0.15;

    // floor for barrel
    const f = floorBelow(b.x, b.w, b.y + b.h - b.vy);
    if (b.vy >= 0 && f && b.y + b.h >= f.y && b.y + b.h <= f.y + 18 + b.vy) {
      b.y = f.y - b.h; b.vy = 0;
    }
    // walls: bounce, but docs on the bottom girder roll off into the pit
    if (b.x <= 0) {
      if (Math.abs((b.y + b.h) - level.floors[0]) < 6) {
        b.dead = true;
        spawnBits(b.x + b.w/2, b.y + b.h/2, 8);  // shredded paper poof
        SFX.smash();
      } else { b.x = 0; b.vx = Math.abs(b.vx); }
    }
    if (b.x + b.w >= W) { b.x = W - b.w; b.vx = -Math.abs(b.vx); }

    // resting on a girder at a ladder top -> sometimes tumble down it
    if (b.vy === 0) {
      const bl = ladderTopAt(b.x + b.w/2, b.y + b.h);
      if (bl && Math.random() < 0.05) {
        b.descending = true;
        b.ladderX = bl.x + 7 - b.w/2;
        b.targetY = bl.bottom;
      }
    }
    if (b.y > H + 40) b.dead = true;
  }
  barrels = barrels.filter(b => !b.dead);

  // ----- Collisions -----
  for (const b of barrels) {
    if (rectsOverlap(p, b)) {
      // jumping over barrel scores points
      if (p.vy < 0 || (p.jumping && p.y + p.h < b.y + 4)) {
        // landing on top is fine-ish, treat as hit unless clearly above
      }
      loseLife();
      return;
    }
    // scoring: jumping just over a barrel
    if (!b.scored && p.jumping && Math.abs((p.x) - (b.x)) < 18 && p.y + p.h < b.y) {
      b.scored = true; score += 100; SFX.point();
      addPopup(b.x, b.y - 6, "+100", "#ffe24a");
    }
  }

  // ----- Win check -----
  if (rectsOverlap(p, goal)) {
    score += bonus + 1000;
    state = "win"; stateTimer = 0; SFX.win();
    addShake(8);
    flash = 1; flashCol = "255,210,120";
    addPopup(goal.x - 6, goal.y - 18, "+" + (bonus + 1000), "#ffd27f");
    spawnBits(goal.x + goal.w/2, goal.y, 18, "#ffd27f");
  }

  // fell off bottom
  if (p.y > H + 30) loseLife();
}

// ---------- Drawing ----------
function px(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); }

function drawGirder(p) {
  // beveled girder with rivets (colour varies per level)
  const g = palette.g;
  px(p.x, p.y, p.w, 11, g[0]);
  px(p.x, p.y, p.w, 2, g[1]);          // top highlight
  px(p.x, p.y + 2, p.w, 3, g[2]);      // upper face
  px(p.x, p.y + 9, p.w, 2, g[3]);      // underside shadow
  for (let x = p.x + 8; x < p.x + p.w - 4; x += 24) {
    px(x, p.y + 4, 3, 3, "#ffe3a6");   // rivet
    px(x, p.y + 6, 3, 1, "#9a5b1e");   // rivet shadow
  }
}
function drawLadder(l) {
  // glowing ladder with 3D rails (colour varies per level)
  const rail = palette.rail, sh = palette.railSh, rung = palette.rung;
  px(l.x - 1, l.top, 4, l.h, sh);      // left rail shadow
  px(l.x, l.top, 3, l.h, rail);        // left rail
  px(l.x + 10, l.top, 4, l.h, sh);     // right rail shadow
  px(l.x + 11, l.top, 3, l.h, rail);   // right rail
  for (let y = l.top + 4; y < l.bottom - 2; y += 9) {
    px(l.x + 1, y + 1, 13, 1, sh);     // rung shadow
    px(l.x + 1, y, 13, 2, rung);       // rung
  }
}

// Spark — the blue spiky hero (inspired by the uploaded sprite)
function drawHero(p) {
  const f = p.facing;
  const T = performance.now();
  const bob = (p.onGround && p.vx === 0) ? Math.round(Math.sin(T / 300)) : 0;
  const air = !p.onGround;
  // squash & stretch: stretch tall in the air, flatten on landing
  let sx = 1, sy = 1;
  if (air) { const st = Math.max(-0.3, Math.min(0.3, -p.vy * 0.025)); sy = 1 + st; sx = 1 - st; }
  else if (p.squash > 0.05) { sy = 1 - 0.32 * p.squash; sx = 1 + 0.32 * p.squash; }
  ctx.save();
  ctx.translate(p.x + p.w/2, p.y + p.h + bob);  // anchor at feet
  ctx.scale(f * sx, sy);
  ctx.translate(-p.w/2, -p.h);
  const B = "#28c4ff", BL = "#8fe4ff", D = "#0a7bcc", K = "#06263a", WI = "#ffffff", Y = "#ffe24a";
  // soft electric glow
  ctx.fillStyle = "rgba(60,200,255,0.20)";
  ctx.fillRect(0, 2, 16, 16);
  // body
  px(3, 4, 10, 12, B); px(2, 6, 12, 9, B); px(4, 2, 8, 3, B);
  px(4, 4, 6, 5, BL);                 // upper sheen
  // electric spikes
  px(5, 0, 2, 3, B); px(8, -1, 2, 4, B); px(11, 0, 2, 3, B);
  px(1, 4, 2, 3, B); px(13, 4, 2, 3, B);
  px(8, -1, 2, 2, Y);                 // glowing tip
  // belly shading
  px(3, 14, 10, 2, D);
  // eyes (blink ~every 3.4s)
  const blink = (T % 3400) < 150;
  if (blink) { px(5, 8, 3, 1, K); px(9, 8, 3, 1, K); }
  else {
    px(5, 6, 3, 4, WI); px(9, 6, 3, 4, WI);
    px(6, 7, 2, 2, K);  px(10, 7, 2, 2, K);
  }
  // cheek bolt + smile
  px(2, 10, 1, 2, Y);
  px(6, 11, 4, 1, K); px(7, 12, 2, 1, K);
  // legs
  const step = (Math.floor(p.walkFrame) % 2 === 0 && p.vx !== 0) ? 1 : 0;
  if (air) { px(4, 15, 3, 3, D); px(9, 15, 3, 3, D); } // tucked mid-jump
  else { px(4, 16, 3, 4 - step, D); px(9, 16, 3, 3 + step, D); }
  ctx.restore();
}

// Chen Kong — large pixel villain boss (no stereotyping; classic arcade brute)
function drawKong(k) {
  const T = performance.now();
  const breathe = Math.round(Math.sin(T / 420));
  const x = k.x, y = k.y + breathe;
  const SK = "#e8b483", SKD = "#c08b5a", HAIR = "#15151c", SH = "#3a3656", SHL = "#4f4a72", SHD = "#22203a", EYE="#fff", PUP="#111", BELT="#d4ad3e";
  const raise = Math.sin(k.anim) > 0 ? -5 : 0;
  // doc ammo pile beside him
  px(x+44, y+34, 12, 8, "#efe9d2"); px(x+44, y+34, 12, 1, "#fff"); px(x+46, y+37, 8, 1, "#9aa6c0");
  px(x+46, y+30, 12, 6, "#efe9d2"); px(x+46, y+30, 12, 1, "#fff");
  // torso (dark gi)
  px(x+6, y+18, 36, 24, SH);
  px(x+6, y+18, 36, 3, SHL);
  px(x+8, y+21, 8, 16, SHL);           // chest highlight
  px(x+6, y+39, 36, 3, SHD);
  // belt + buckle
  px(x+6, y+30, 36, 3, BELT);
  px(x+22, y+30, 4, 3, "#8a6a18");
  // arms
  px(x-2, y+20, 8, 14, SH);            // left arm
  px(x+42, y+20+raise, 8, 14, SH);     // right arm (rears back to throw)
  px(x-3, y+32, 7, 6, SKD);            // left hand
  px(x+43, y+18+raise, 7, 6, SKD);     // right hand
  // head
  px(x+12, y+2, 24, 18, SK);
  px(x+12, y+2, 24, 2, SKD);
  px(x+13, y+4, 6, 12, "#f2c79a");     // face highlight
  // hair (black, neat)
  px(x+10, y, 28, 6, HAIR);
  px(x+10, y+4, 4, 8, HAIR);
  px(x+34, y+4, 4, 8, HAIR);
  // eyebrows (angrier as he winds up)
  const brow = raise ? -1 : 0;
  px(x+15, y+8+brow, 6, 2, HAIR);
  px(x+27, y+8+brow, 6, 2, HAIR);
  // eyes
  px(x+16, y+10, 5, 4, EYE); px(x+27, y+10, 5, 4, EYE);
  px(x+18, y+11, 2, 2, PUP); px(x+29, y+11, 2, 2, PUP);
  // grimace
  px(x+18, y+16, 12, 2, HAIR);
  px(x+20, y+15, 8, 1, SKD);
  // anger steam while winding up
  if (raise) { px(x+38, y-2, 2, 4, "#cfe8ff"); px(x+40, y-5, 2, 3, "#cfe8ff"); }
  // legs
  px(x+10, y+42, 12, 4, SHD);
  px(x+26, y+42, 12, 4, SHD);
}

function drawGoal(g) {
  // captive friend (pink) calling for help
  const x=g.x, y=g.y;
  const T = performance.now();
  const P="#ff7fb0", PD="#d65a8a", PL="#ffa9c9", H="#ffd24a", SK="#ffd9b3";
  // dress
  px(x+4, y+12, 14, 16, P);
  px(x+5, y+13, 5, 12, PL);     // dress highlight
  px(x+4, y+26, 14, 2, PD);
  // head
  px(x+6, y+2, 10, 10, SK);
  px(x+7, y+3, 4, 5, "#ffe6cc");
  // hair
  px(x+4, y, 14, 4, H);
  px(x+4, y+2, 3, 9, H); px(x+15, y+2, 3, 9, H);
  // eyes + worried mouth
  px(x+8, y+5, 2, 2, "#111"); px(x+12, y+5, 2, 2, "#111");
  px(x+9, y+9, 5, 1, PD);
  // waving arms
  const w = Math.sin(T/150) > 0 ? -3 : 0;
  px(x+1, y+12+w, 4, 3, SK);    // raised waving arm
  px(x+16, y+15, 4, 3, SK);     // other arm
  // blinking HELP! speech bubble
  if ((T/450|0) % 2 === 0) {
    px(x-9, y-13, 24, 11, "#fff");
    px(x-9, y-13, 24, 1, "#cfd6e6");
    px(x+3, y-2, 3, 3, "#fff");  // bubble tail
    ctx.fillStyle = "#d0263d";
    ctx.font = "bold 8px 'Courier New', monospace";
    ctx.textAlign = "center";
    ctx.fillText("HELP!", x+3, y-5);
  }
}

// A flying "requirements doc" — a sheet of paper with text lines and a dog-eared corner
function drawBarrel(b) {
  ctx.save();
  ctx.translate(b.x + b.w/2, b.y + b.h/2);
  ctx.rotate(b.rot * 0.5);
  ctx.translate(-b.w/2, -b.h/2);
  const PAPER = "#f6f3e7", EDGE = "#cfc8a8", INK = "#5a6b8c", RED = "#d0263d";
  // page body
  px(1, 0, b.w-2, b.h, PAPER);
  px(1, 0, b.w-2, 1, "#ffffff");
  px(0, 1, 1, b.h-2, EDGE);
  px(b.w-1, 1, 1, b.h-2, EDGE);
  px(1, b.h-1, b.w-2, 1, EDGE);
  // dog-eared top-right corner
  px(b.w-4, 0, 3, 3, EDGE);
  // "REQUIREMENTS" header bar
  px(3, 2, b.w-6, 2, RED);
  // body text lines
  px(3, 6, b.w-7, 1, INK);
  px(3, 8, b.w-5, 1, INK);
  px(3, 10, b.w-8, 1, INK);
  px(3, 12, b.w-6, 1, INK);
  ctx.restore();
}

function drawHUD() {
  ctx.fillStyle = "#fff";
  ctx.font = "12px 'Courier New', monospace";
  ctx.textAlign = "left";
  ctx.fillText("SCORE " + String(score).padStart(6, "0"), 8, 16);
  ctx.fillStyle = "#39c0ff";
  ctx.fillText("BONUS " + String(bonus).padStart(4," "), 8, 30);
  // lives
  ctx.textAlign = "right";
  ctx.fillStyle = "#ff7fb0";
  ctx.fillText("♥".repeat(Math.max(0,lives)), W - 8, 16);
  ctx.fillStyle = "#fff";
  ctx.fillText("L-" + level_num, W - 8, 30);
}

function drawScene() {
  const T = performance.now();
  // screen-shake: jolt the whole world layer
  ctx.save();
  if (shake) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  // background: night-sky gradient (over-drawn so shake never reveals edges)
  const grd = ctx.createLinearGradient(0, 0, 0, H);
  grd.addColorStop(0, "#10122b");
  grd.addColorStop(0.5, "#0a0a18");
  grd.addColorStop(1, "#05050c");
  ctx.fillStyle = grd;
  ctx.fillRect(-16, -16, W + 32, H + 32);
  // moon with craters
  ctx.fillStyle = "#26264a";
  ctx.beginPath(); ctx.arc(W - 66, 72, 34, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#3b3b62";
  ctx.beginPath(); ctx.arc(W - 66, 72, 29, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#15152e";
  ctx.beginPath(); ctx.arc(W - 56, 64, 7, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(W - 76, 82, 5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(W - 60, 86, 3, 0, Math.PI * 2); ctx.fill();
  // twinkling stars
  for (let i = 0; i < 46; i++) {
    const sx = (i * 97) % W, sy = (i * 53) % (H - 60) + 16;
    const tw = 0.35 + 0.6 * Math.abs(Math.sin(T / 700 + i));
    ctx.fillStyle = "rgba(150,170,255," + tw.toFixed(2) + ")";
    const s = (i % 7 === 0) ? 2 : 1;
    ctx.fillRect(sx, sy, s, s);
  }
  drawSkyline(T);
  for (const l of level.ladders) drawLadder(l);
  for (const p of level.platforms) drawGirder(p);
  drawGoal(goal);
  drawKong(kong);
  drawThrowAim();
  // throw release flashes
  for (const fx of throwFx) {
    const r = (1 - fx.life) * 8 + 2;
    ctx.fillStyle = "rgba(255,226,74," + (fx.life * 0.8).toFixed(2) + ")";
    ctx.fillRect(fx.x - r, fx.y - 1, r * 2, 2);
    ctx.fillRect(fx.x - 1, fx.y - r, 2, r * 2);
  }
  for (const b of barrels) drawBarrel(b);
  // Spark's trail (behind the hero)
  for (const t of trail) {
    const s = Math.max(1, Math.round(t.life * 3));
    ctx.globalAlpha = t.life * 0.8;
    px(t.x - s/2, t.y - s/2, s, s, t.c);
  }
  ctx.globalAlpha = 1;
  drawHero(player);
  // debris bits
  for (const b of bits) {
    ctx.globalAlpha = Math.min(1, b.life);
    px(b.x - 1, b.y - 1, 2, 2, b.c);
  }
  // floating score popups
  ctx.textAlign = "center";
  ctx.font = "bold 12px 'Courier New', monospace";
  for (const pp of popups) {
    ctx.globalAlpha = Math.min(1, pp.life * 1.4);
    ctx.fillStyle = "#000";
    ctx.fillText(pp.text, pp.x + 1, pp.y + 1);
    ctx.fillStyle = pp.c;
    ctx.fillText(pp.text, pp.x, pp.y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
  // full-screen flash (hit / win)
  if (flash > 0.02) {
    ctx.fillStyle = "rgba(" + flashCol + "," + (flash * 0.45).toFixed(2) + ")";
    ctx.fillRect(0, 0, W, H);
  }
  drawHUD();
}

// Distant parallax city skyline (shifts slightly with Spark's position)
function drawSkyline(T) {
  const dx = -player.x * 0.06;
  const base = 452;
  for (let i = 0; i < 14; i++) {
    const bx = Math.round(-30 + i * 38 + dx);
    const bw = 24 + (i * 13 % 12);
    const bh = 40 + ((i * 37) % 58);
    px(bx, base - bh, bw, bh, "#0d1030");
    px(bx, base - bh, bw, 2, "#181c40");      // roof edge
    for (let wy = base - bh + 6; wy < base - 4; wy += 8) {
      for (let wx = bx + 4; wx < bx + bw - 4; wx += 7) {
        const lit = ((wx * 3 + wy * 5 + i) % 13 === 0) && Math.sin(T / 600 + wx) > 0.3;
        px(wx, wy, 3, 3, lit ? "#ffd27f" : "#1b2150");
      }
    }
  }
}

// Dotted arc previewing the next doc toss as Chen Kong winds up
function drawThrowAim() {
  if (kong.throwTimer > 24 || kong.throwTimer < 0) return;
  const alpha = (1 - kong.throwTimer / 24) * 0.5;
  let x = kong.x + kong.w, y = kong.y + kong.h - 14, vx = 1.4, vy = -1.8;
  ctx.fillStyle = "rgba(255,226,74," + alpha.toFixed(2) + ")";
  for (let step = 0; step < 70; step++) {
    vy += GRAV; x += vx; y += vy;
    if (y > kong.y + kong.h + 4) break;
    if (step % 4 === 0) ctx.fillRect(x, y, 2, 2);
  }
}

function center(text, y, c="#fff", size=20) {
  ctx.fillStyle = c;
  ctx.font = size + "px 'Courier New', monospace";
  ctx.textAlign = "center";
  ctx.fillText(text, W/2, y);
}

function drawTitle() {
  ctx.fillStyle = "#0a0a12"; ctx.fillRect(0,0,W,H);
  // draw kong big in middle
  ctx.save();
  ctx.translate(W/2 - 48, 150); ctx.scale(2,2);
  const k = {x:0,y:0,w:48,h:44,anim: performance.now()/300};
  drawKong(k);
  ctx.restore();
  center("CHEN  KONG", 90, "#39c0ff", 40);
  center("the requirements-hurling boss", 120, "#6a6a8a", 13);
  center("starring SPARK ⚡", 138, "#19b6ff", 13);
  center("Help SPARK climb to the top.", 300, "#cfe8ff", 14);
  center("Dodge the requirements docs. Rescue your friend!", 322, "#cfe8ff", 14);
  if ((performance.now()/500|0) % 2 === 0)
    center("PRESS ENTER / TAP TO START", 380, "#ffd27f", 16);
  center("← → move   ↑ climb   SPACE jump", 420, "#4a4a6a", 12);
  if (bestScore > 0) center("BEST " + bestScore, 450, "#6a6a8a", 12);
}

function drawDead() {
  drawScene();
  ctx.fillStyle = "rgba(0,0,0,.55)"; ctx.fillRect(0,0,W,H);
  center("OUCH!", H/2 - 10, "#ff5b76", 32);
  center(lives + " lives left", H/2 + 20, "#fff", 16);
}
function drawWin() {
  drawScene();
  ctx.fillStyle = "rgba(0,0,0,.55)"; ctx.fillRect(0,0,W,H);
  center("RESCUED!", H/2 - 20, "#ffd27f", 34);
  center("Next level...", H/2 + 16, "#fff", 16);
}
function drawGameOver() {
  ctx.fillStyle = "#0a0a12"; ctx.fillRect(0,0,W,H);
  center("GAME OVER", H/2 - 30, "#ff5b76", 38);
  center("Score  " + score, H/2 + 10, "#fff", 18);
  center("Best   " + bestScore, H/2 + 36, "#6a6a8a", 14);
  if ((performance.now()/500|0) % 2 === 0)
    center("PRESS ENTER TO PLAY AGAIN", H/2 + 80, "#ffd27f", 16);
}

// ---------- Effects stepping (runs every frame, all states) ----------
function updateFx() {
  shake *= 0.85; if (shake < 0.3) shake = 0;
  flash *= 0.90; if (flash < 0.02) flash = 0;
  for (const b of bits) { b.x += b.vx; b.y += b.vy; b.vy += 0.18; b.life -= 0.04; }
  bits = bits.filter(b => b.life > 0);
  for (const pp of popups) { pp.y -= 0.6; pp.life -= 0.02; }
  popups = popups.filter(pp => pp.life > 0);
}

// ---------- Main loop ----------
function loop() {
  updateFx();
  switch (state) {
    case "title":
      if (keys.start) { startGame(); keys.start = false; }
      drawTitle();
      break;
    case "play":
      updatePlay();
      if (state === "play") drawScene();
      break;
    case "dead":
      drawDead();
      stateTimer++;
      if (stateTimer > 80) { resetPlayer(); barrels = []; state = "play"; }
      break;
    case "win":
      drawWin();
      stateTimer++;
      if (stateTimer > 110) { level_num++; newLevel(); state = "play"; }
      break;
    case "gameover":
      drawGameOver();
      if (keys.start) { startGame(); keys.start = false; }
      break;
  }
  requestAnimationFrame(loop);
}
resetPlayer();
loop();
})();
</script>
